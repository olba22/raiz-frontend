<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAIZ — Facturar</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --verde: #1DB954; --negro: #0A0A0A; --gris-osc: #111111;
      --gris-card: #161616; --gris-brd: #222222; --blanco: #F5F5F5;
      --texto-sec: #888888; --naranja: #FF6B00; --rojo: #ff4444; --azul: #3b82f6;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--negro); color: var(--blanco); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* ── ENCABEZADO ── */
    .pos-header {
      display: flex; align-items: center; gap: .85rem;
      padding: .85rem 1rem; border-bottom: 1px solid var(--gris-brd);
      background: var(--gris-osc); position: sticky; top: 0; z-index: 20;
      flex-shrink: 0;
    }
    .pos-back {
      width: 38px; height: 38px; border-radius: 10px; background: var(--gris-card);
      border: 1px solid var(--gris-brd); color: var(--blanco); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; flex-shrink: 0;
      transition: border-color .15s;
    }
    .pos-back:hover { border-color: var(--verde); }
    .pos-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; flex: 1; }
    .pos-title span { display: block; font-family: 'Inter'; font-weight: 500; font-size: .72rem; color: var(--texto-sec); }

    /* ── BUSCADOR ── */
    .pos-buscar-wrap { padding: .75rem 1rem 0; background: var(--negro); flex-shrink: 0; display: flex; gap: .5rem; }
    .pos-buscar {
      width: 100%; background: var(--gris-card); border: 1px solid var(--gris-brd);
      border-radius: 12px; padding: .8rem 1rem; color: var(--blanco); font-size: .95rem; font-family: inherit;
    }
    .pos-buscar:focus { outline: none; border-color: var(--verde); }

    /* ── MICRÓFONO / FACTURACIÓN POR VOZ ── */
    .pos-mic-btn {
      width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--gris-brd);
      background: var(--gris-card); color: var(--blanco); font-size: 1.25rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s;
    }
    .pos-mic-btn:hover { border-color: var(--verde); }
    .pos-mic-btn.escuchando { background: var(--rojo); border-color: var(--rojo); animation: pos-pulso 1s infinite; }
    @keyframes pos-pulso { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    .voz-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.78); z-index: 600;
      display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    }
    .voz-modal {
      background: var(--gris-osc); border: 1px solid var(--gris-brd); border-radius: 16px;
      padding: 1.25rem; max-width: 420px; width: 100%; max-height: 82vh;
      display: flex; flex-direction: column; gap: .85rem;
    }
    .voz-modal-header { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.05rem; }
    .voz-modal-texto {
      font-size: .82rem; color: var(--texto-sec); font-style: italic;
      border-left: 2px solid var(--gris-brd); padding-left: .6rem;
    }
    .voz-modal-lista { display: flex; flex-direction: column; gap: .5rem; overflow-y: auto; max-height: 38vh; }
    .voz-item {
      display: flex; align-items: center; gap: .6rem; padding: .55rem .7rem;
      background: var(--gris-card); border: 1px solid var(--gris-brd); border-radius: 10px;
    }
    .voz-item.personalizado { border-color: var(--naranja); }
    .voz-item-emoji { font-size: 1.2rem; flex-shrink: 0; }
    .voz-item-info { flex: 1; font-size: .84rem; font-weight: 600; }
    .voz-item-info small { display: block; font-weight: 500; color: var(--texto-sec); font-size: .74rem; margin-top: .1rem; }
    .voz-modal-botones { display: flex; gap: .5rem; flex-wrap: wrap; }
    .voz-modal-botones button {
      flex: 1; min-width: 100px; padding: .75rem; border-radius: 10px; border: 1px solid var(--gris-brd);
      font-weight: 700; font-size: .84rem; cursor: pointer; font-family: inherit;
    }
    .voz-btn-cancelar { background: var(--gris-card); color: var(--texto-sec); }
    .voz-btn-reintentar { background: var(--gris-card); color: var(--blanco); }
    .voz-btn-confirmar { background: var(--verde); color: var(--negro); border-color: var(--verde); }

    /* ── CATEGORIAS ── */
    .pos-cats {
      display: flex; gap: .5rem; padding: .85rem 1rem; overflow-x: auto;
      background: var(--negro); scrollbar-width: none; flex-shrink: 0;
    }
    .pos-cats::-webkit-scrollbar { display: none; }
    .pos-cat-pill {
      flex-shrink: 0; padding: .55rem 1.1rem; border-radius: 999px; border: 1px solid var(--gris-brd);
      background: var(--gris-card); color: var(--texto-sec); font-size: .82rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .pos-cat-pill.active { background: var(--verde); border-color: var(--verde); color: var(--negro); }

    /* ── LAYOUT PRINCIPAL ── */
    .pos-body { display: flex; flex: 1; min-height: 0; }
    .pos-grid-wrap { flex: 1; overflow-y: auto; padding: 0 1rem 1rem; }
    .pos-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: .7rem;
    }
    .pos-prod {
      background: var(--gris-card); border: 1px solid var(--gris-brd); border-radius: 14px;
      padding: .8rem .7rem; cursor: pointer; user-select: none; transition: transform .1s, border-color .15s;
      display: flex; flex-direction: column; gap: .35rem; position: relative; overflow: hidden;
    }
    .pos-prod:active { transform: scale(.96); border-color: var(--verde); }
    .pos-prod-emoji { font-size: 1.6rem; }
    .pos-prod-nombre { font-size: .82rem; font-weight: 600; line-height: 1.25; min-height: 2.1em; }
    .pos-prod-precio { font-size: .85rem; font-weight: 700; color: var(--verde); }
    .pos-prod-badge {
      position: absolute; top: .5rem; right: .5rem; background: var(--verde); color: var(--negro);
      font-size: .72rem; font-weight: 800; min-width: 20px; height: 20px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; padding: 0 .3rem;
    }
    .pos-vacio { color: var(--texto-sec); font-size: .88rem; text-align: center; padding: 3rem 1rem; }

    /* ── CARRITO (desktop: panel fijo / mobile: bandeja) ── */
    .pos-carrito {
      width: 340px; flex-shrink: 0; background: var(--gris-osc); border-left: 1px solid var(--gris-brd);
      display: flex; flex-direction: column;
    }
    .pos-carrito-lista { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .pos-item {
      display: flex; align-items: center; gap: .6rem; padding: .6rem 0; border-bottom: 1px solid var(--gris-brd);
    }
    .pos-item-info { flex: 1; min-width: 0; }
    .pos-item-nombre { font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pos-item-precio { font-size: .72rem; color: var(--texto-sec); }
    .pos-stepper { display: flex; align-items: center; gap: .4rem; }
    .pos-stepper button {
      width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--gris-brd); background: var(--gris-card);
      color: var(--blanco); font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .pos-stepper button:hover { border-color: var(--verde); }
    .pos-stepper span { min-width: 18px; text-align: center; font-weight: 700; font-size: .85rem; }
    .pos-item-total { min-width: 64px; text-align: right; font-weight: 700; font-size: .84rem; color: var(--verde); }

    /* ── CANTIDAD RÁPIDA POR LIBRA (solo Colmado) ── */
    .pos-qty-wrap { display: flex; flex-direction: column; gap: .4rem; flex: 1; min-width: 0; }
    .pos-qty-label { font-size: .8rem; font-weight: 800; color: var(--verde); }
    .pos-qty-btns { display: flex; gap: .3rem; flex-wrap: wrap; }
    .pos-qty-btn {
      padding: .28rem .5rem; border-radius: 7px; border: 1px solid var(--gris-brd);
      background: var(--gris-card); color: var(--blanco); font-size: .76rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .pos-qty-btn:hover { border-color: var(--verde); color: var(--verde); }
    .pos-qty-quitar {
      width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--gris-brd); background: var(--gris-card);
      color: var(--texto-sec); font-size: .85rem; cursor: pointer; flex-shrink: 0;
    }
    .pos-qty-quitar:hover { border-color: var(--rojo); color: var(--rojo); }

    .pos-carrito-footer { padding: 1rem; border-top: 1px solid var(--gris-brd); }
    .pos-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .85rem; }
    .pos-total-label { font-size: .85rem; color: var(--texto-sec); }
    .pos-total-valor { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--verde); }
    .pos-confirmar {
      width: 100%; padding: 1rem; border-radius: 12px; border: none; background: var(--verde);
      color: var(--negro); font-weight: 800; font-size: .95rem; cursor: pointer; font-family: inherit;
    }
    .pos-confirmar:disabled { opacity: .6; cursor: not-allowed; }
    .pos-confirmar:hover:not(:disabled) { filter: brightness(1.08); }

    /* ── BANDEJA MÓVIL ── */
    .pos-mobile-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--gris-osc); border-top: 1px solid var(--gris-brd);
    }
    .pos-mobile-toggle {
      display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.1rem; cursor: pointer;
    }
    .pos-mobile-toggle-info { display: flex; align-items: center; gap: .6rem; }
    .pos-mobile-count {
      background: var(--verde); color: var(--negro); font-weight: 800; font-size: .78rem;
      min-width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    }
    .pos-mobile-total { font-family: 'Syne', sans-serif; font-weight: 800; color: var(--verde); }
    .pos-mobile-flecha { color: var(--texto-sec); font-size: .8rem; transition: transform .2s; }
    .pos-mobile-bar.open .pos-mobile-flecha { transform: rotate(180deg); }
    .pos-mobile-panel { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
    .pos-mobile-bar.open .pos-mobile-panel { max-height: 60vh; overflow-y: auto; }

    /* ── TOAST ── */
    .toast {
      position: fixed; top: 1.25rem; right: 1.25rem; z-index: 500;
      background: var(--gris-card); border: 1px solid var(--gris-brd);
      border-radius: 12px; padding: .85rem 1.25rem;
      font-size: .88rem; font-weight: 600;
      display: flex; align-items: center; gap: .6rem;
      opacity: 0; transform: translateY(-8px); transition: all .3s;
      max-width: 320px; left: 1.25rem;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: var(--verde); }
    .toast.error { border-color: var(--rojo); }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      .pos-carrito { display: none; }
      .pos-mobile-bar { display: block; }
      .pos-grid-wrap { padding-bottom: 1rem; }
    }
  </style>
</head>
<body>

  <div class="pos-header">
    <a class="pos-back" href="raiz-dashboard.html" title="Volver al panel">←</a>
    <div class="pos-title" id="posTitulo">Facturar
      <span id="posSubtitulo">Cargando negocio...</span>
    </div>
  </div>

  <div class="pos-buscar-wrap">
    <input class="pos-buscar" id="posBuscar" type="text" placeholder="🔍 Buscar producto..." oninput="posFiltrar()" autocomplete="off" />
    <button class="pos-mic-btn" id="posMicBtn" onclick="posToggleVoz()" title="Facturar por voz">🎤</button>
  </div>

  <div class="pos-cats" id="posCats"></div>

  <div id="posFavoritosWrap" style="display:none;padding:0 1rem .5rem;flex-shrink:0;">
    <div style="font-size:.72rem;font-weight:700;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;">⭐ Favoritos</div>
    <div class="pos-grid" id="posFavoritosGrid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));margin-bottom:.75rem;"></div>
  </div>
  <div id="posRecientesWrap" style="display:none;padding:0 1rem .5rem;flex-shrink:0;">
    <div style="font-size:.72rem;font-weight:700;color:var(--texto-sec);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;">🕒 Recientes</div>
    <div class="pos-grid" id="posRecientesGrid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));margin-bottom:.75rem;"></div>
  </div>

  <div class="pos-body">
    <div class="pos-grid-wrap">
      <div class="pos-grid" id="posGrid"></div>
    </div>

    <!-- CARRITO DE ESCRITORIO -->
    <div class="pos-carrito">
      <div class="pos-carrito-lista" id="posCarritoDesktop"></div>
      <div class="pos-carrito-footer">
        <div class="pos-total-row">
          <span class="pos-total-label">Total a cobrar</span>
          <span class="pos-total-valor" id="posTotalDesktop">RD$0</span>
        </div>
        <button class="pos-confirmar" id="posBtnConfirmarDesktop" onclick="posConfirmarVenta()">✓ Confirmar venta</button>
      </div>
    </div>
  </div>

  <!-- BANDEJA MÓVIL -->
  <div class="pos-mobile-bar" id="posMobileBar">
    <div class="pos-mobile-toggle" onclick="posToggleMobile()">
      <div class="pos-mobile-toggle-info">
        <span class="pos-mobile-count" id="posMobileCount">0</span>
        <span>Ver carrito</span>
      </div>
      <div style="display:flex;align-items:center;gap:.7rem;">
        <span class="pos-mobile-total" id="posTotalMobile">RD$0</span>
        <span class="pos-mobile-flecha">▲</span>
      </div>
    </div>
    <div class="pos-mobile-panel">
      <div class="pos-carrito-lista" id="posCarritoMobile" style="max-height:40vh;"></div>
      <div class="pos-carrito-footer">
        <button class="pos-confirmar" id="posBtnConfirmarMobile" onclick="posConfirmarVenta()">✓ Confirmar venta</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE CONFIRMACIÓN DE VOZ -->
  <div class="voz-overlay" id="vozOverlay" style="display:none;">
    <div class="voz-modal">
      <div class="voz-modal-header">🎙️ Entendí esto:</div>
      <div class="voz-modal-texto" id="vozTextoOriginal"></div>
      <div class="voz-modal-lista" id="vozLista"></div>
      <div class="voz-modal-botones">
        <button class="voz-btn-cancelar" onclick="cerrarModalVoz()">✕ Cancelar</button>
        <button class="voz-btn-reintentar" onclick="cerrarModalVoz(); iniciarReconocimientoVoz();">🔄 Repetir</button>
        <button class="voz-btn-confirmar" onclick="confirmarPedidoVoz()">✓ Agregar al carrito</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = 'https://raiz-backend.onrender.com';
    let NEGOCIO_ID = null;
    let NEGOCIO_SLUG = null;
    let NEGOCIO_TIPO = 'general';
    let productos = [];
    let categoriaActiva = 'todas';
    let carrito = []; // { idx, nombre, emoji, precio, cantidad, unidad, personalizado? }

    // Botones rápidos de cantidad para productos que se venden por libra
    const PRESETS_LIBRA = [0.25, 0.5, 0.75, 1, 2, 5];

    // Convierte 1.75 -> "1¾", 0.5 -> "½", 2 -> "2", etc.
    function formatCantidad(n) {
      const entero = Math.floor(n);
      const frac = Math.round((n - entero) * 100) / 100;
      const glifos = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' };
      const glifo = glifos[frac] !== undefined ? glifos[frac] : (frac ? `.${Math.round(frac * 100)}` : '');
      if (entero === 0 && glifo) return glifo;
      return `${entero}${glifo}`;
    }

    function authHeaders() {
      const token = localStorage.getItem('raiz_token');
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    function manejarRespuestaAuth(res) {
      if (res.status === 401) {
        toast('⚠️ Tu sesión expiró, inicia sesión de nuevo', 'error');
        localStorage.removeItem('raiz_token');
        setTimeout(() => window.location.href = '/raiz-login.html', 1500);
        return true;
      }
      return false;
    }

    function toast(msg, tipo) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (tipo || '');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    async function cargarDatos() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || localStorage.getItem('raiz_negocio_slug');
      if (!slug) { toast('⚠️ No se encontró el negocio, vuelve al panel', 'error'); return; }
      try {
        const res = await fetch(`${API}/negocios/${encodeURIComponent(slug)}`);
        if (!res.ok) { toast('⚠️ No se pudo cargar el negocio', 'error'); return; }
        const data = await res.json();
        const negocio = data.negocio;
        if (!negocio) return;

        NEGOCIO_ID = negocio.id;
        NEGOCIO_SLUG = negocio.slug;
        NEGOCIO_TIPO = negocio.tipo_negocio || 'general';
        document.getElementById('posSubtitulo').textContent = negocio.nombre || 'Mi negocio';

        productos = (data.productos || [])
          .map((p, idx) => ({
            idx,
            id: p.id,
            emoji: p.emoji || '📦',
            nombre: p.nombre,
            precio: Number(p.precio),
            cat: p.categoria || 'general',
            activo: p.disponible !== false,
            unidad: p.unidad_venta || 'unidad',
            vendidos: Number(p.total_vendidos || 0)
          }))
          .filter(p => p.activo);

        renderCategorias();
        renderFavoritosYRecientes();
        renderGrid();
      } catch (e) {
        toast('⚠️ No se pudo conectar con el servidor', 'error');
        console.error('Error al cargar negocio/productos:', e);
      }
    }

    function renderCategorias() {
      const cats = Array.from(new Set(productos.map(p => p.cat)));
      const cont = document.getElementById('posCats');
      const todas = [{ valor: 'todas', label: 'Todos' }, ...cats.map(c => ({ valor: c, label: c.charAt(0).toUpperCase() + c.slice(1) }))];
      cont.innerHTML = todas.map(c => `
        <div class="pos-cat-pill ${c.valor === categoriaActiva ? 'active' : ''}" onclick="posSetCategoria('${c.valor}')">${c.label}</div>
      `).join('');
    }

    function posSetCategoria(cat) {
      categoriaActiva = cat;
      renderCategorias();
      renderGrid();
    }

    function posFiltrar() {
      renderGrid();
    }

    // ── FAVORITOS Y RECIENTES ──
    function tarjetaMini(p) {
      const enCarrito = carrito.find(i => i.idx === p.idx);
      const badge = enCarrito ? (p.unidad === 'libra' ? formatCantidad(enCarrito.cantidad) : enCarrito.cantidad) : '';
      return `
        <div class="pos-prod" onclick="posAgregar(${p.idx})" style="padding:.6rem .5rem;">
          ${enCarrito ? `<div class="pos-prod-badge">${badge}</div>` : ''}
          <div class="pos-prod-emoji" style="font-size:1.3rem;">${p.emoji}</div>
          <div class="pos-prod-nombre" style="font-size:.74rem;min-height:1.8em;">${p.nombre}</div>
          <div class="pos-prod-precio" style="font-size:.76rem;">RD$${p.precio.toLocaleString()}</div>
        </div>
      `;
    }

    function obtenerRecientesGuardados() {
      try {
        const clave = `raiz_pos_recientes_${NEGOCIO_SLUG}`;
        return JSON.parse(localStorage.getItem(clave) || '[]');
      } catch (e) { return []; }
    }

    function guardarProductoReciente(productoId) {
      if (!productoId) return;
      const clave = `raiz_pos_recientes_${NEGOCIO_SLUG}`;
      let lista = obtenerRecientesGuardados().filter(id => id !== productoId);
      lista.unshift(productoId);
      lista = lista.slice(0, 8);
      localStorage.setItem(clave, JSON.stringify(lista));
    }

    function renderFavoritosYRecientes() {
      const favoritosWrap = document.getElementById('posFavoritosWrap');
      const recientesWrap = document.getElementById('posRecientesWrap');

      const favoritos = productos.filter(p => p.vendidos > 0).sort((a, b) => b.vendidos - a.vendidos).slice(0, 6);
      if (favoritos.length) {
        document.getElementById('posFavoritosGrid').innerHTML = favoritos.map(tarjetaMini).join('');
        favoritosWrap.style.display = 'block';
      } else {
        favoritosWrap.style.display = 'none';
      }

      const idsRecientes = obtenerRecientesGuardados();
      const recientes = idsRecientes
        .map(id => productos.find(p => p.id === id))
        .filter(Boolean)
        .slice(0, 6);
      if (recientes.length) {
        document.getElementById('posRecientesGrid').innerHTML = recientes.map(tarjetaMini).join('');
        recientesWrap.style.display = 'block';
      } else {
        recientesWrap.style.display = 'none';
      }
    }

    function renderGrid() {
      const texto = (document.getElementById('posBuscar').value || '').trim().toLowerCase();
      const cont = document.getElementById('posGrid');
      const lista = productos.filter(p =>
        (categoriaActiva === 'todas' || p.cat === categoriaActiva) &&
        (!texto || p.nombre.toLowerCase().includes(texto))
      );
      if (!lista.length) {
        cont.innerHTML = `<div class="pos-vacio">Sin productos en esta categoría.</div>`;
        return;
      }
      cont.innerHTML = lista.map(p => {
        const enCarrito = carrito.find(i => i.idx === p.idx);
        const badge = enCarrito ? (p.unidad === 'libra' ? formatCantidad(enCarrito.cantidad) : enCarrito.cantidad) : '';
        return `
          <div class="pos-prod" onclick="posAgregar(${p.idx})">
            ${enCarrito ? `<div class="pos-prod-badge">${badge}</div>` : ''}
            <div class="pos-prod-emoji">${p.emoji}</div>
            <div class="pos-prod-nombre">${p.nombre}</div>
            <div class="pos-prod-precio">RD$${p.precio.toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }

    function posAgregar(idx) {
      const p = productos.find(x => x.idx === idx);
      if (!p) return;
      const existente = carrito.find(i => i.idx === idx);
      if (existente) {
        // Si ya está en el carrito y es un producto por libra, un toque más en la
        // tarjeta agrega 1 libra adicional (los botones rápidos del carrito cubren el resto)
        existente.cantidad += 1;
      } else {
        carrito.push({ idx, nombre: p.nombre, emoji: p.emoji, precio: p.precio, cantidad: 1, unidad: p.unidad });
      }
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
    }

    // Agrega (o suma) una cantidad exacta a un producto, creando la fila del carrito si no existía.
    // Usado por la facturación por voz para agregar directo la cantidad detectada.
    function posAgregarConCantidad(idx, cantidad) {
      const p = productos.find(x => x.idx === idx);
      if (!p) return;
      const existente = carrito.find(i => i.idx === idx);
      if (existente) {
        existente.cantidad = Math.round((existente.cantidad + cantidad) * 100) / 100;
      } else {
        carrito.push({ idx, nombre: p.nombre, emoji: p.emoji, precio: p.precio, cantidad, unidad: p.unidad });
      }
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
    }

    function posCambiarCantidad(idx, delta) {
      const item = carrito.find(i => i.idx === idx);
      if (!item) return;
      item.cantidad += delta;
      if (item.cantidad <= 0) carrito = carrito.filter(i => i.idx !== idx);
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
    }

    // Suma una cantidad exacta (usado por los botones rápidos ¼, ½, ¾, 1, 2, 5 lb)
    function posAgregarCantidad(idx, monto) {
      const item = carrito.find(i => i.idx === idx);
      if (!item) return;
      item.cantidad = Math.round((item.cantidad + monto) * 100) / 100;
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
    }

    function posQuitarItem(idx) {
      carrito = carrito.filter(i => i.idx !== idx);
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
    }

    function renderItemHTML(item) {
      // Línea "personalizada" (detectada por voz pero sin coincidir con ningún producto)
      if (item.personalizado) {
        return `
          <div class="pos-item">
            <div class="pos-item-info">
              <div class="pos-item-nombre">🎤 ${item.nombre}</div>
              <div class="pos-item-precio" style="color:var(--naranja);">A confirmar con el cliente</div>
            </div>
            <button class="pos-qty-quitar" onclick="posQuitarItem(${item.idx})">🗑️</button>
          </div>
        `;
      }

      const esLibraColmado = NEGOCIO_TIPO === 'colmado' && item.unidad === 'libra';

      if (esLibraColmado) {
        return `
          <div class="pos-item">
            <div class="pos-qty-wrap">
              <div class="pos-qty-label">${item.emoji} ${item.nombre} — ${formatCantidad(item.cantidad)} lb</div>
              <div class="pos-qty-btns">
                ${PRESETS_LIBRA.map(m => `<button class="pos-qty-btn" onclick="posAgregarCantidad(${item.idx}, ${m})">${formatCantidad(m)}</button>`).join('')}
              </div>
            </div>
            <div class="pos-item-total">RD$${(item.cantidad * item.precio).toLocaleString()}</div>
            <button class="pos-qty-quitar" onclick="posQuitarItem(${item.idx})">🗑️</button>
          </div>
        `;
      }

      return `
        <div class="pos-item">
          <div class="pos-item-info">
            <div class="pos-item-nombre">${item.emoji} ${item.nombre}</div>
            <div class="pos-item-precio">RD$${item.precio.toLocaleString()} c/u</div>
          </div>
          <div class="pos-stepper">
            <button onclick="posCambiarCantidad(${item.idx}, -1)">−</button>
            <span>${item.cantidad}</span>
            <button onclick="posCambiarCantidad(${item.idx}, 1)">+</button>
          </div>
          <div class="pos-item-total">RD$${(item.cantidad * item.precio).toLocaleString()}</div>
        </div>
      `;
    }

    function renderCarrito() {
      const total = carrito.reduce((s, i) => s + i.cantidad * i.precio, 0);
      const cantidadTotal = carrito.reduce((s, i) => s + i.cantidad, 0);

      const filas = !carrito.length
        ? `<p style="color:var(--texto-sec);font-size:.85rem;text-align:center;padding:1.5rem 0;">Toca un producto para agregarlo.</p>`
        : carrito.map(renderItemHTML).join('');

      document.getElementById('posCarritoDesktop').innerHTML = filas;
      document.getElementById('posCarritoMobile').innerHTML = filas;
      document.getElementById('posTotalDesktop').textContent = `RD$${total.toLocaleString()}`;
      document.getElementById('posTotalMobile').textContent = `RD$${total.toLocaleString()}`;
      document.getElementById('posMobileCount').textContent = Math.round(cantidadTotal * 100) / 100;
    }

    function posToggleMobile() {
      document.getElementById('posMobileBar').classList.toggle('open');
    }

    async function posConfirmarVenta() {
      if (!carrito.length) { toast('⚠️ Agrega al menos un producto', 'error'); return; }

      const items = carrito.map(item => {
        const p = productos.find(x => x.idx === item.idx);
        return {
          producto_id: p ? p.id : null,
          nombre_producto: item.personalizado ? `${item.nombre} (a confirmar)` : item.nombre,
          precio_unitario: item.precio,
          cantidad: item.cantidad
        };
      });

      const btnD = document.getElementById('posBtnConfirmarDesktop');
      const btnM = document.getElementById('posBtnConfirmarMobile');
      [btnD, btnM].forEach(b => { b.disabled = true; b.textContent = 'Enviando...'; });

      try {
        const res = await fetch(`${API}/pedidos`, {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            negocio_id: NEGOCIO_ID,
            items,
            costo_delivery: 0,
            canal: 'local',
            cliente_nombre: 'Cliente de mostrador',
            cliente_direccion: 'Venta en mostrador',
            notas: 'Venta facturada en mostrador (POS)'
          })
        });
        if (manejarRespuestaAuth(res)) return;

        const textoRespuesta = await res.text();
        let data = {};
        try { data = textoRespuesta ? JSON.parse(textoRespuesta) : {}; } catch (e) { /* no era JSON */ }

        if (!res.ok) {
          toast(`⚠️ ${data.detail || textoRespuesta || 'No se pudo facturar (Error ' + res.status + ')'}`, 'error');
          console.error('Error al facturar:', res.status, textoRespuesta);
          return;
        }

        toast(`✅ Venta facturada — ${data.codigo}`, 'success');
        carrito.forEach(item => {
          const p = productos.find(x => x.idx === item.idx);
          if (p && p.id) guardarProductoReciente(p.id);
        });
        carrito = [];
        renderGrid();
        renderFavoritosYRecientes();
        renderCarrito();
        document.getElementById('posMobileBar').classList.remove('open');
      } catch (e) {
        toast('⚠️ No se pudo conectar con el servidor', 'error');
        console.error('Error de red al facturar:', e);
      } finally {
        [btnD, btnM].forEach(b => { b.disabled = false; b.textContent = '✓ Confirmar venta'; });
      }
    }

    // ══════════════════ FACTURACIÓN POR VOZ ══════════════════
    const NUMEROS_TEXTO = {
      'un': 1, 'una': 1, 'uno': 1, 'dos': 2, 'tres': 3, 'cuatro': 4, 'cinco': 5,
      'seis': 6, 'siete': 7, 'ocho': 8, 'nueve': 9, 'diez': 10
    };
    const FRACCIONES_TEXTO = { 'medio': 0.5, 'media': 0.5, 'cuarto': 0.25 };
    const PALABRAS_UNIDAD = ['libras', 'libra', 'lb', 'fundas', 'funda', 'docenas', 'docena', 'onzas', 'onza', 'unidades', 'unidad'];

    let reconocimientoVoz = null;
    let escuchandoVoz = false;
    let resultadosVozActuales = [];
    const vozDisponible = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

    function quitarAcentos(t) {
      return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function extraerCantidadYResto(texto) {
      let t = texto.trim();

      // Fracciones de dos palabras ("tres cuartos", "un cuarto")
      if (t.startsWith('tres cuartos')) return { cantidad: 0.75, resto: t.slice('tres cuartos'.length).trim() };
      if (t.startsWith('un cuarto')) return { cantidad: 0.25, resto: t.slice('un cuarto'.length).trim() };

      const primeraPalabra = t.split(' ')[0];

      // Fracciones de una palabra ("media", "medio", "cuarto")
      if (FRACCIONES_TEXTO[primeraPalabra] !== undefined) {
        return { cantidad: FRACCIONES_TEXTO[primeraPalabra], resto: t.slice(primeraPalabra.length).trim() };
      }
      // Números en dígitos ("2 libras de arroz", "1.5 libras")
      const matchDigito = t.match(/^(\d+(\.\d+)?)\s*/);
      if (matchDigito) {
        return { cantidad: parseFloat(matchDigito[1]), resto: t.slice(matchDigito[0].length).trim() };
      }
      // Números en palabras ("dos fundas de agua")
      if (NUMEROS_TEXTO[primeraPalabra] !== undefined) {
        return { cantidad: NUMEROS_TEXTO[primeraPalabra], resto: t.slice(primeraPalabra.length).trim() };
      }
      return { cantidad: 1, resto: t };
    }

    function quitarPalabrasUnidad(texto) {
      let t = texto.trim();
      for (const palabra of PALABRAS_UNIDAD) {
        const regex = new RegExp('^' + palabra + '\\b', 'i');
        if (regex.test(t)) { t = t.replace(regex, '').trim(); break; }
      }
      t = t.replace(/^de\s+/, ''); // quita un "de" sobrante: "libra de arroz" -> "arroz"
      return t;
    }

    function buscarProductoPorTexto(texto) {
      const textoNorm = quitarAcentos(texto.toLowerCase()).trim();
      if (!textoNorm) return null;
      let mejor = null;
      let mejorLargo = 0;
      for (const p of productos) {
        const nombreNorm = quitarAcentos(p.nombre.toLowerCase());
        if (textoNorm.includes(nombreNorm) || nombreNorm.includes(textoNorm)) {
          if (nombreNorm.length > mejorLargo) { mejor = p; mejorLargo = nombreNorm.length; }
        }
      }
      return mejor;
    }

    // Convierte el texto dictado (ej: "dos fundas de agua y una libra de arroz")
    // en una lista de { tipo: 'producto'|'personalizado', ... }
    function procesarTextoVoz(textoCompleto) {
      const textoNorm = quitarAcentos(textoCompleto.toLowerCase());
      const trozos = textoNorm.split(/,| y /).map(s => s.trim()).filter(Boolean);
      const resultados = [];

      for (const trozo of trozos) {
        const { cantidad, resto } = extraerCantidadYResto(trozo);
        const nombreBuscado = quitarPalabrasUnidad(resto);
        const producto = buscarProductoPorTexto(nombreBuscado);

        if (producto) {
          const cantidadFinal = producto.unidad === 'libra' ? cantidad : Math.max(1, Math.round(cantidad));
          resultados.push({
            tipo: 'producto', idx: producto.idx, nombre: producto.nombre,
            emoji: producto.emoji, precio: producto.precio, unidad: producto.unidad, cantidad: cantidadFinal
          });
        } else {
          resultados.push({ tipo: 'personalizado', textoOriginal: trozo });
        }
      }
      return resultados;
    }

    function posToggleVoz() {
      if (escuchandoVoz) {
        if (reconocimientoVoz) reconocimientoVoz.stop();
        return;
      }
      iniciarReconocimientoVoz();
    }

    function iniciarReconocimientoVoz() {
      if (!vozDisponible) {
        toast('⚠️ Tu navegador no soporta pedidos por voz, usa Chrome', 'error');
        return;
      }
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      reconocimientoVoz = new SR();
      reconocimientoVoz.lang = 'es-419';
      reconocimientoVoz.interimResults = false;
      reconocimientoVoz.maxAlternatives = 1;

      const btn = document.getElementById('posMicBtn');
      escuchandoVoz = true;
      btn.classList.add('escuchando');
      btn.textContent = '🔴';
      toast('🎙️ Escuchando... di los productos', '');

      reconocimientoVoz.onresult = (evento) => {
        const texto = evento.results[0][0].transcript;
        mostrarConfirmacionVoz(texto);
      };
      reconocimientoVoz.onerror = () => {
        toast('⚠️ No se entendió, intenta de nuevo', 'error');
      };
      reconocimientoVoz.onend = () => {
        escuchandoVoz = false;
        btn.classList.remove('escuchando');
        btn.textContent = '🎤';
      };
      reconocimientoVoz.start();
    }

    function mostrarConfirmacionVoz(textoOriginal) {
      resultadosVozActuales = procesarTextoVoz(textoOriginal);
      document.getElementById('vozTextoOriginal').textContent = `"${textoOriginal}"`;
      document.getElementById('vozLista').innerHTML = resultadosVozActuales.map(r => {
        if (r.tipo === 'producto') {
          const cantTexto = r.unidad === 'libra' ? `${formatCantidad(r.cantidad)} lb` : `${r.cantidad}x`;
          return `
            <div class="voz-item">
              <div class="voz-item-emoji">${r.emoji}</div>
              <div class="voz-item-info">${r.nombre}<small>${cantTexto} — RD$${(r.cantidad * r.precio).toLocaleString()}</small></div>
            </div>
          `;
        }
        return `
          <div class="voz-item personalizado">
            <div class="voz-item-emoji">🎤</div>
            <div class="voz-item-info">${r.textoOriginal}<small>No identificado — se agregará a confirmar</small></div>
          </div>
        `;
      }).join('');
      document.getElementById('vozOverlay').style.display = 'flex';
    }

    function cerrarModalVoz() {
      document.getElementById('vozOverlay').style.display = 'none';
      resultadosVozActuales = [];
    }

    function confirmarPedidoVoz() {
      resultadosVozActuales.forEach(r => {
        if (r.tipo === 'producto') {
          posAgregarConCantidad(r.idx, r.cantidad);
        } else {
          carrito.push({
            idx: -(Date.now() + Math.floor(Math.random() * 1000)),
            nombre: r.textoOriginal,
            emoji: '🎤',
            precio: 0,
            cantidad: 1,
            unidad: 'unidad',
            personalizado: true
          });
        }
      });
      renderGrid();
      renderFavoritosYRecientes();
      renderCarrito();
      cerrarModalVoz();
      toast('✅ Pedido de voz agregado al carrito', 'success');
    }

    cargarDatos();
    renderCarrito();
  </script>
</body>
</html>
